<ion-header>
  <ion-toolbar color="success">
    <ion-title>Menú</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="sidebar-content" fullscreen>
  <!-- Usuario -->
  <div class="user-info">
    <h6>{{ user?.firstName }}</h6>
    <p>{{ user?.email }}</p>
  </div>

  <!-- Menú -->
  <ion-list>
    <ion-item button (click)="navigateTo('info')" [color]="activePath === 'info' ? 'success' : ''">
      <ion-icon slot="start" name="person-outline"></ion-icon>
      <ion-label>Mi Información</ion-label>
    </ion-item>

    <ion-item button (click)="navigateTo('favorite')" [color]="activePath === 'favorite' ? 'success' : ''">
      <ion-icon slot="start" name="heart-outline"></ion-icon>
      <ion-label>Favoritos</ion-label>
    </ion-item>

    <ion-item routerLink="/pedidos" routerLinkActive="active">
      <ion-icon slot="start" name="bag-handle-outline"></ion-icon>
      <ion-label>Pedidos</ion-label>
    </ion-item>

    <ion-item button (click)="navigateTo('producer')" [color]="activePath === 'producer' ? 'success' : ''">
      <ion-icon slot="start" name="briefcase-outline"></ion-icon>
      <ion-label>Productor</ion-label>
    </ion-item>

    <ion-item button (click)="navigateTo('support')" [color]="activePath === 'support' ? 'success' : ''">
      <ion-icon slot="start" name="help-circle-outline"></ion-icon>
      <ion-label>Soporte</ion-label>
    </ion-item>

    <!-- Seguridad con submenú -->
    <ion-accordion-group>
      <ion-accordion value="seguridad">
        <ion-item slot="header">
          <ion-icon name="shield-checkmark-outline" slot="start"></ion-icon>
          <ion-label>Seguridad</ion-label>
        </ion-item>
        <div slot="content">
          <ion-item button (click)="navigateTo('security/user')" [color]="activePath === 'security/user' ? 'success' : ''">
            <ion-icon slot="start" name="people-outline"></ion-icon>
            <ion-label>Usuarios</ion-label>
          </ion-item>
          <ion-item button (click)="navigateTo('security/rol')" [color]="activePath === 'security/rol' ? 'success' : ''">
            <ion-icon slot="start" name="people-outline"></ion-icon>
            <ion-label>Roles</ion-label>
          </ion-item>
          <ion-item button (click)="navigateTo('security/rolUser')" [color]="activePath === 'security/rolUser' ? 'success' : ''">
            <ion-icon slot="start" name="people-outline"></ion-icon>
            <ion-label>Roles y Usuarios</ion-label>
          </ion-item>
          <ion-item button (click)="navigateTo('security/permission')" [color]="activePath === 'security/permission' ? 'success' : ''">
            <ion-icon slot="start" name="key-outline"></ion-icon>
            <ion-label>Permisos</ion-label>
          </ion-item>
          <ion-item button (click)="navigateTo('security/form')" [color]="activePath === 'security/form' ? 'success' : ''">
            <ion-icon slot="start" name="document-outline"></ion-icon>
            <ion-label>Formularios</ion-label>
          </ion-item>
          <ion-item button (click)="navigateTo('security/module')" [color]="activePath === 'security/module' ? 'success' : ''">
            <ion-icon slot="start" name="layers-outline"></ion-icon>
            <ion-label>Módulos</ion-label>
          </ion-item>
          <ion-item button (click)="navigateTo('security/formModule')" [color]="activePath === 'security/formModule' ? 'success' : ''">
            <ion-icon slot="start" name="git-network-outline"></ion-icon>
            <ion-label>Módulos y Formularios</ion-label>
          </ion-item>
          <ion-item button (click)="navigateTo('security/rolFormPermission')" [color]="activePath === 'security/rolFormPermission' ? 'success' : ''">
            <ion-icon slot="start" name="shield-outline"></ion-icon>
            <ion-label>Rol, Formularios y Permisos</ion-label>
          </ion-item>
        </div>
      </ion-accordion>
    </ion-accordion-group>

    <!-- Parámetros con submenú -->
    <ion-accordion-group>
      <ion-accordion value="parametros">
        <ion-item slot="header">
          <ion-icon name="settings-outline" slot="start"></ion-icon>
          <ion-label>Parámetros</ion-label>
        </ion-item>
        <div slot="content">
          <ion-item button (click)="navigateTo('parameters/category')" [color]="activePath === 'parameters/category' ? 'success' : ''">
            <ion-icon slot="start" name="pricetags-outline"></ion-icon>
            <ion-label>Categorías</ion-label>
          </ion-item>
          <ion-item button (click)="navigateTo('parameters/department')" [color]="activePath === 'parameters/department' ? 'success' : ''">
            <ion-icon slot="start" name="business-outline"></ion-icon>
            <ion-label>Departamento</ion-label>
          </ion-item>
          <ion-item button (click)="navigateTo('parameters/city')" [color]="activePath === 'parameters/city' ? 'success' : ''">
            <ion-icon slot="start" name="home-outline"></ion-icon>
            <ion-label>Ciudad</ion-label>
          </ion-item>
        </div>
      </ion-accordion>
    </ion-accordion-group>
  </ion-list>
</ion-content>
